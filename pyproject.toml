[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-chatter"
version = "0.2.0"
description = "Claude Code peer messaging protocol and client library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "non7top" }]
keywords = ["claude-code", "ipc", "unix-domain-sockets", "peer-messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/non7top/claude-chatter"
Issues = "https://github.com/non7top/claude-chatter/issues"
Changelog = "https://github.com/non7top/claude-chatter/blob/master/CHANGELOG.md"

[project.scripts]
claude-chatter = "claude_chatter.cli:main"
chatter = "claude_chatter.cli:main"

[tool.setuptools]
packages = ["claude_chatter"]
