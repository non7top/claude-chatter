name: publish

on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag to publish to PyPI, e.g. v0.2.0'
        required: true

permissions:
  contents: read

jobs:
  check-release-tag:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find a stable release tag
        id: find_tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$TAG' is not a stable vX.Y.Z tag; pre-releases are not published"
              exit 1
            fi
          else
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: check-release-tag
    if: needs.check-release-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.check-release-tag.outputs.tag }}

      - name: Ensure workspace permissions
        run: chmod -R a+rwX .

      - name: Build container image
        run: make build

      - name: Build sdist and wheel
        run: make package

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-dist
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.14.3
